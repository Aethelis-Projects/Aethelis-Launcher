name: CI Quality Gate & Anti-Slop Enforcement

on:
  push:
    branches: [ master, main, "release/*" ]
  pull_request:
    branches: [ master, main ]

jobs:
  core-and-frontend:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install Linux GUI Dependencies (GTK4 & WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12"

      - name: Verify IPC Codegen Parity
        run: |
          go run ./ipc/codegen/generate.go
          git diff --exit-code || (echo "IPC types are out of sync with schema. Run go run ./ipc/codegen/generate.go" && exit 1)
        shell: bash

      - name: Run Core Go Tests & Coverage Gate (>= 80%)
        run: |
          go test -v -race ./internal/...
          go test -coverprofile=coverage.out ./internal/core/...
          node scripts/check_coverage.js coverage.out
        shell: bash

      - name: Run Autonomous E2E Runner (M3/M4 Gate)
        run: |
          go run ./cmd/e2e/main.go
        shell: bash

      - name: Micro-Benchmark IPC Dispatch Latency (p95 NFR)
        run: |
          go test -bench=BenchmarkWailsAdapter_IPCDispatch -run=^$ ./internal/adapters/wails
        shell: bash

      - name: Security & Vulnerability Audit (govulncheck)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        shell: bash

      - name: Open Source License Compliance (go-licenses)
        run: |
          go run github.com/google/go-licenses@v1.6.0 check --ignore modernc.org/mathutil ./...
        shell: bash

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install

      - name: Frontend TypeScript Typecheck
        working-directory: frontend
        run: pnpm tsc --noEmit

      - name: Frontend Vitest Unit Tests
        working-directory: frontend
        run: pnpm vitest run

      - name: Frontend Build & Bundle Budget Gate (<= 250 KB gzip)
        working-directory: frontend
        run: |
          pnpm build
          node -e '
            const fs = require("fs");
            const zlib = require("zlib");
            const path = require("path");
            let totalGzip = 0;
            const distDir = path.join(process.cwd(), "dist");
            function walk(dir) {
              const files = fs.readdirSync(dir);
              for (const f of files) {
                const full = path.join(dir, f);
                if (fs.statSync(full).isDirectory()) walk(full);
                else {
                  const content = fs.readFileSync(full);
                  totalGzip += zlib.gzipSync(content).length;
                }
              }
            }
            walk(distDir);
            const totalKb = (totalGzip / 1024).toFixed(2);
            console.log("Total Gzip bundle size: " + totalKb + " KB");
            if (totalGzip > 250 * 1024) {
              console.error("VIOLATION: Bundle exceeded 250 KB budget!");
              process.exit(1);
            }
            console.log("PASS: Bundle budget constraint respected.");
          '

      - name: Build Launcher Binary & Check Size Budget (<= 40 MB)
        shell: bash
        run: |
          BIN_PATH="build/nord-launcher"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN_PATH="build/nord-launcher.exe"
          fi
          go build -ldflags="-s -w" -o "$BIN_PATH" cmd/launcher/main.go
          node -e '
            const fs = require("fs");
            const binPath = process.platform === "win32" ? "build/nord-launcher.exe" : "build/nord-launcher";
            if (!fs.existsSync(binPath)) {
              console.error("Binary not found at " + binPath);
              process.exit(1);
            }
            const sizeBytes = fs.statSync(binPath).size;
            const sizeMB = (sizeBytes / (1024 * 1024)).toFixed(2);
            console.log("Built launcher binary size: " + sizeMB + " MB");
            if (sizeBytes > 40 * 1024 * 1024) {
              console.error("VIOLATION: Binary exceeded 40 MB budget!");
              process.exit(1);
            }
            console.log("PASS: Launcher binary size budget (<= 40 MB) respected.");
          '

      - name: Measure Windows NFR Idle & Core Init
        if: runner.os == 'Windows'
        run: |
          ./build/nord-launcher.exe --idle-test
        shell: bash

      - name: Anti-AI-Slop Pre-Flight Linter
        shell: bash
        run: |
          node scripts/anti_slop_lint.js