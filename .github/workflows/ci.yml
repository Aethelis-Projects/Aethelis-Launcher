name: CI Quality Gate

on:
  push:
    branches: [ master, main, "release/*" ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-frontend:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned (mutable tags are the workflow-injection vector)

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 pinned (mutable tags are the workflow-injection vector)
        with:
          go-version: "1.26"
          cache: true

      - name: Install Linux GUI Dependencies (GTK4 & WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned (mutable tags are the workflow-injection vector)
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 pinned (mutable tags are the workflow-injection vector)
        with:
          version: "12"

      - name: Version Consistency Gate (VERSION is the single source)
        # The exact command the release job runs with its tag; CI rehearses
        # it with the matching tag plus a deliberate mismatch, so the
        # tag==VERSION gate can never first-fire on an actual release push.
        run: |
          node scripts/check_version_consistency.js "v$(cat VERSION)"
          if node scripts/check_version_consistency.js v9.9.9 2>/dev/null; then
            echo "CRITICAL: version gate accepted a tag that does not match VERSION"
            exit 1
          fi
          if ! grep -q "^## \[$(cat VERSION)\]" CHANGELOG.md; then
            echo "CRITICAL: CHANGELOG has no section for VERSION"
            exit 1
          fi
          echo "PASS: release-gate path rehearsed (positive + negative + changelog grep)."
        shell: bash

      - name: Verify Workflow Files (actionlint)
        # A workflow that fails to parse schedules ZERO jobs - invisible from
        # a green PR check. v0.7.2 actually shipped that failure mode once, so
        # the linter is now part of the gate. Hard failures = syntax-check and
        # expression errors (the zero-jobs class); shellcheck-style advisories
        # on pre-existing scripts are printed but do not fail the build yet.
        # Linux-only: the pinned artifact is a Linux binary and the Windows
        # runner cannot exec it (observed: exit 126 on the first CI run).
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/al"
          curl -fsSL -o "$RUNNER_TEMP/al/al.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          # pinned version + digest: fetch-and-exec of a mutable release asset is runner RCE
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/al/al.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/al/al.tgz" -C "$RUNNER_TEMP/al" actionlint
          set +e
          "$RUNNER_TEMP/al/actionlint" .github/workflows/ci.yml .github/workflows/release.yml > actionlint.log 2>&1
          ALRC=$?
          set -e
          cat actionlint.log
          ERRS=$(grep -cE "\[(syntax-check|expression|runner-env)\]" actionlint.log || true)
          if [ "$ERRS" -gt 0 ]; then
            echo "actionlint reported $ERRS hard workflow error(s) - such files schedule ZERO jobs"
            exit 1
          fi
          if [ "$ALRC" -ne 0 ] && [ "$ERRS" -eq 0 ]; then
            echo "actionlint advisory-only output (shellcheck class); not gating"
          fi
          echo "PASS: no workflow parse/expression errors."
        shell: bash

      - name: Verify gofmt (CI-measured, keeps the README claim honest)
        # Command substitution is not portable: Git Bash on Windows execs
        # real gofmt but /usr/bin/bash for `$(...)`, so capture the list via
        # an output env var instead of inlining it in a test -z.
        run: gofmt -l internal cmd ipc scripts
        id: gofmtlist
      - name: Verify gofmt (list must be empty)
        run: test -z "${{ env.UNFORMATTED }}" || { echo "Unformatted files:"; echo "$GOFMT_LIST"; exit 1; }
        env:
          UNFORMATTED: ${{ steps.gofmtlist.outputs.stdout }}
          GOFMT_LIST: ${{ steps.gofmtlist.outputs.stdout }}

      - name: Verify IPC Codegen Parity
        run: |
          go run ./ipc/codegen/generate.go
          git diff --exit-code || (echo "IPC types are out of sync with schema. Run go run ./ipc/codegen/generate.go" && exit 1)
        shell: bash

      - name: Run Go Static Analysis (go vet)
        # Note: frontend/embed.go requires //go:embed all:dist. On a fresh clone, frontend/dist is gitignored
        # and doesn't exist yet, causing go vet to abort with "no matching files found". Creating a stub directory
        # with .gitkeep satisfies the compiler's embed directive prior to running frontend build.
        run: |
          mkdir -p frontend/dist && touch frontend/dist/.gitkeep
          go vet ./...
        shell: bash

      - name: Run Core Go Tests & Coverage Gate (>= 80%)
        id: covgate
        run: |
          go test -v -race ./internal/...
          go test -coverprofile=coverage.out ./internal/core/...
          node scripts/check_coverage.js coverage.out
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          mkdir -p coverage && echo "$TOTAL" > coverage/coverage.txt
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "core coverage total: ${TOTAL}%"
        shell: bash

      - name: Run E2E Integration Runner
        # Default Linux backend (GTK4/WebKitGTK-6.0, the README promise):
        # NO build tags. Local sandbox runs often use -tags gtk3 only because
        # the distro image lacks libwebkitgtk-6.0-dev - CI/release MUST match
        # this command, not the sandbox one (v0.7.2 round-4 review).
        run: |
          go run ./cmd/e2e/main.go
        shell: bash

      - name: Micro-Benchmark IPC Dispatch Latency (p95 NFR)
        run: |
          go test -bench=BenchmarkWailsAdapter_IPCDispatch -run=^$ ./internal/adapters/wails | tee bench.log
          node scripts/check_bench.js bench.log
        shell: bash

      - name: Security & Vulnerability Audit (govulncheck)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        shell: bash

      - name: Open Source License Compliance (go-licenses)
        # modernc.org/mathutil is BSD-3-Clause licensed (pure Go SQLite dependency),
        # but ignored here because go-licenses cannot resolve its sub-module license file.
        run: |
          go run github.com/google/go-licenses@v1.6.0 check --ignore modernc.org/mathutil ./cmd/launcher
        shell: bash

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install

      - name: Frontend TypeScript Typecheck
        working-directory: frontend
        run: pnpm tsc --noEmit

      - name: Frontend Vitest Unit Tests
        working-directory: frontend
        run: pnpm vitest run

      - name: Frontend Build & Bundle Budget Gate (<= 250 KB gzip)
        working-directory: frontend
        run: |
          pnpm build
          node -e '
            const fs = require("fs");
            const zlib = require("zlib");
            const path = require("path");
            let totalGzip = 0;
            const distDir = path.join(process.cwd(), "dist");
            function walk(dir) {
              const files = fs.readdirSync(dir);
              for (const f of files) {
                const full = path.join(dir, f);
                if (fs.statSync(full).isDirectory()) walk(full);
                else {
                  const content = fs.readFileSync(full);
                  totalGzip += zlib.gzipSync(content).length;
                }
              }
            }
            walk(distDir);
            const totalKb = (totalGzip / 1024).toFixed(2);
            console.log("Total Gzip bundle size: " + totalKb + " KB");
            if (totalGzip > 250 * 1024) {
              console.error("VIOLATION: Bundle exceeded 250 KB budget!");
              process.exit(1);
            }
            console.log("PASS: Bundle budget constraint respected.");
          '

      - name: Build Launcher Binary & Check Size Budget (<= 40 MB)
        shell: bash
        run: |
          BIN_PATH="build/nord-launcher"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN_PATH="build/nord-launcher.exe"
          fi
          go build -ldflags="-s -w -X main.version=$(cat VERSION)" -o "$BIN_PATH" cmd/launcher/main.go
          node -e '
            const fs = require("fs");
            const binPath = process.platform === "win32" ? "build/nord-launcher.exe" : "build/nord-launcher";
            if (!fs.existsSync(binPath)) {
              console.error("Binary not found at " + binPath);
              process.exit(1);
            }
            const sizeBytes = fs.statSync(binPath).size;
            const sizeMB = (sizeBytes / (1024 * 1024)).toFixed(2);
            console.log("Built launcher binary size: " + sizeMB + " MB");
            if (sizeBytes > 40 * 1024 * 1024) {
              console.error("VIOLATION: Binary exceeded 40 MB budget!");
              process.exit(1);
            }
            console.log("PASS: Launcher binary size budget (<= 40 MB) respected.");
          '

      - name: Measure Windows NFR Idle & Core Init
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./build/nord-launcher.exe --idle-test | tee idle_test.log
          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("idle_test.log", "utf8");
            const match = log.match(/CORE_INIT_TIME_MS:\s*(\d+)/);
            if (!match) { console.error("Could not parse CORE_INIT_TIME_MS"); process.exit(1); }
            const ms = parseInt(match[1], 10);
            console.log("Measured core init time: " + ms + " ms");
            if (ms > 500) { console.error("VIOLATION: Core init exceeded 500 ms threshold!"); process.exit(1); }
            console.log("PASS: Core init time within budget (<= 500 ms).");
          '

      - name: Code Hygiene Linter (TypeScript + Go)
        shell: bash
        run: |
          node scripts/code_hygiene_lint.js