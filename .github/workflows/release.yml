name: Production Release & Cross-Platform Packaging

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag (vX.Y.Z) to dry-run; empty = current HEAD (release-candidate rehearsal, never publishes)"
        required: false
        default: ""
      publish:
        description: "Publish the GitHub Release (only honoured on tag pushes)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read   # only publish-release escalates (owner p5-4: least privilege)

jobs:
  build-windows:
    name: Build & Package Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned (mutable tags are the workflow-injection vector)
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 pinned (mutable tags are the workflow-injection vector)
        with:
          go-version: "1.26"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned (mutable tags are the workflow-injection vector)
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 pinned (mutable tags are the workflow-injection vector)
        with:
          version: "12"

      - name: Build Frontend
        working-directory: frontend
        run: |
          pnpm install
          pnpm build

      - name: Write CurseForge Sidecar Key
        env:
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows
          if ($env:CURSEFORGE_KEY) {
            Set-Content -Path "dist/windows/cf.key" -Value $env:CURSEFORGE_KEY -NoNewline
            Write-Host "Created dist/windows/cf.key ($($env:CURSEFORGE_KEY.Length) chars)"
          }

      - name: Compile Windows Executable
        shell: pwsh
        run: |
          go build "-ldflags=-s -w -H=windowsgui -X main.version=$($env:GITHUB_REF_NAME)" -o dist/windows/NordLauncher.exe cmd/launcher/main.go

      - name: Verify Secret Not In Shipped Binary (S2 Asserts 1 & 2)
        env:
          CF_SECRET: ${{ secrets.CURSEFORGE_API_KEY }}
        shell: pwsh
        run: |
          $buildInfo = go version -m dist/windows/NordLauncher.exe | Out-String
          if ($buildInfo -match "CurseForgeKey" -or ($env:CF_SECRET -and $buildInfo.Contains($env:CF_SECRET))) {
            Write-Error "CRITICAL SECURITY ERROR: Secret leaked in go version -m buildinfo!"
            exit 1
          }
          Write-Host "PASS: go version -m is clean of secrets."

          if ($env:CF_SECRET) {
            $hasSecret = Select-String -Path "dist/windows/NordLauncher.exe" -Pattern $env:CF_SECRET -SimpleMatch -Quiet
            if ($hasSecret) {
              Write-Error "CRITICAL SECURITY ERROR: Secret found in executable strings table!"
              exit 1
            }
            Write-Host "PASS: Executable binary is clean of secret."
          }

      - name: Verify Sidecar Key Present for Installer (S2 Assert 3)
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/windows/cf.key")) {
            Write-Error "ERROR: dist/windows/cf.key was not created!"
            exit 1
          }
          $keyLen = (Get-Item "dist/windows/cf.key").Length
          if ($keyLen -lt 16) {
            Write-Error "ERROR: dist/windows/cf.key length ($keyLen bytes) is below minimum (16)!"
            exit 1
          }
          Write-Host "PASS: dist/windows/cf.key verified ($keyLen bytes)."

      - name: Check Binary Size Budget (<= 40 MB)
        run: |
          node -e '
            const fs = require("fs");
            const bin = "dist/windows/NordLauncher.exe";
            const size = fs.statSync(bin).size;
            console.log("Binary size: " + (size / 1048576).toFixed(2) + " MB");
            if (size > 40 * 1024 * 1024) {
              console.error("Binary exceeded 40 MB budget!");
              process.exit(1);
            }
          '

      - name: Sign Windows Executable (Authenticode)
        shell: pwsh
        run: |
          ./scripts/sign_windows.ps1 -TargetFile "dist/windows/NordLauncher.exe"

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) {
              $makensis = $cmd.Source
            } else {
              choco install nsis -y --no-progress
              $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
            }
          }
          & $makensis "/DVERSION=${{ github.ref_name }}" build/windows/installer.nsi
          if (Test-Path "build/windows/NordLauncher-Setup.exe") {
            Move-Item -Force build/windows/NordLauncher-Setup.exe dist/windows/NordLauncher-Setup.exe
          } elseif (Test-Path "NordLauncher-Setup.exe") {
            Move-Item -Force NordLauncher-Setup.exe dist/windows/NordLauncher-Setup.exe
          }

      - name: Sign NSIS Installer (Authenticode)
        shell: pwsh
        run: |
          ./scripts/sign_windows.ps1 -TargetFile "dist/windows/NordLauncher-Setup.exe"

      - name: Build Windows Portable Zip (6th Release Asset)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $zipName = "nord-launcher-$ver-windows-x64-portable.zip"
          New-Item -ItemType Directory -Force -Path "dist/windows/portable-staging"
          Copy-Item "dist/windows/NordLauncher.exe" "dist/windows/portable-staging/"
          if (Test-Path "dist/windows/cf.key") {
            Copy-Item "dist/windows/cf.key" "dist/windows/portable-staging/"
          }
          Compress-Archive -Path "dist/windows/portable-staging/*" -DestinationPath "dist/windows/$zipName" -Force
          Remove-Item -Recurse -Force "dist/windows/portable-staging"
          Write-Host "PASS: Created dist/windows/$zipName"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned (mutable tags are the workflow-injection vector)
        with:
          name: nord-launcher-windows
          path: |
            dist/windows/NordLauncher.exe
            dist/windows/NordLauncher-Setup.exe
            dist/windows/nord-launcher-*-windows-x64-portable.zip

  build-linux:
    name: Build & Package Linux (x64)
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
      bundle_gzip_kb: ${{ steps.assetmeta.outputs.bundle_gzip_kb }}
      core_coverage: ${{ steps.covtotal.outputs.total }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned (mutable tags are the workflow-injection vector)
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      - name: Resolve Release Tag (real tag on push, v$(cat VERSION) on dispatch)
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 pinned (mutable tags are the workflow-injection vector)
        with:
          go-version: "1.26"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned (mutable tags are the workflow-injection vector)
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 pinned (mutable tags are the workflow-injection vector)
        with:
          version: "12"

      - name: Install Linux GUI Dependencies (GTK4 & WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev pkg-config

      - name: Build Release Tarball
        env:
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -n "$CURSEFORGE_KEY" ]; then
            if [ ${#CURSEFORGE_KEY} -lt 16 ]; then
              echo "ERROR: Invalid CURSEFORGE_API_KEY secret length (expected at least 16 chars)"
              exit 1
            fi
          fi
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh "${{ github.ref_name }}" "$CURSEFORGE_KEY"
        shell: bash

      - name: Verify Secret Not In Shipped Linux Binary & Tarball (S2 Linux Asserts 1, 2, 3)
        env:
          CF_SECRET: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          BUILD_INFO=$(go version -m dist/linux/nord-launcher)
          if echo "$BUILD_INFO" | grep -Eq "CurseForgeKey"; then
            echo "CRITICAL SECURITY ERROR: Secret leaked in Linux buildinfo!"
            exit 1
          fi
          if [ -n "$CF_SECRET" ]; then
            if echo "$BUILD_INFO" | grep -Fq "$CF_SECRET"; then
              echo "CRITICAL SECURITY ERROR: Secret string found in Linux buildinfo!"
              exit 1
            fi
            if grep -Fq "$CF_SECRET" dist/linux/nord-launcher; then
              echo "CRITICAL SECURITY ERROR: Secret string found in Linux binary!"
              exit 1
            fi
          fi
          TARBALL=$(ls dist/linux/nord-launcher-v*-linux-amd64.tar.gz)
          if ! tar -ztvf "$TARBALL" | grep -q "cf.key"; then
            echo "ERROR: cf.key not packaged into release tarball!"
            exit 1
          fi
          echo "PASS: Linux binary and tarball verified (clean binary + sidecar present in tarball)."
        shell: bash

      - name: Core Coverage Total (README metrics; same command as the CI gate)
        id: covtotal
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          go test -coverprofile=corecov.out ./internal/core/... > /dev/null 2>&1 || true
          TOTAL=$(go tool cover -func=corecov.out 2>/dev/null | awk '/^total:/ {print $3}' | tr -d '%' || true)
          echo "total=${TOTAL:-n/a}" >> "$GITHUB_OUTPUT"
          echo "core coverage total on the release build: ${TOTAL:-n/a}%"
        shell: bash

      - name: Frontend Bundle Size (README metrics, gzip)
        id: assetmeta
        run: |
          # `ls -d a b` exits 2 when ANY operand is missing - even if the other one
          # exists - and `set -o pipefail` turns that into a failed assignment. That
          # is how the v0.7.2 dispatch rehearsal died here (nothing else was wrong).
          # Probe the candidates instead, and fail loudly if none is a directory:
          # silently reporting 0 KB would poison metrics.json and the README number.
          DIST=""
          for candidate in frontend/dist dist/linux/frontend; do
            if [ -d "$candidate" ]; then DIST="$candidate"; break; fi
          done
          if [ -z "$DIST" ]; then
            echo "ERROR: no frontend bundle found after the release build (looked at: frontend/dist, dist/linux/frontend) - the tarball step must have produced it."
            exit 1
          fi
          TOTAL=$(find "$DIST" \( -name "*.js" -o -name "*.css" \) -print0 | xargs -0 -r gzip -9 -c | wc -c)
          if [ "${TOTAL:-0}" -le 0 ]; then
            echo "ERROR: $DIST contains no .js/.css to measure - the frontend build did not produce a bundle."
            exit 1
          fi
          KB=$(( (TOTAL + 1023) / 1024 ))
          echo "bundle_gzip_kb=${KB}" >> "$GITHUB_OUTPUT"
          echo "frontend bundle gzip from ${DIST}: ${KB} KB (${TOTAL} bytes)"
        shell: bash

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned (mutable tags are the workflow-injection vector)
        with:
          name: nord-launcher-linux
          path: dist/linux/nord-launcher-v*.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    # Tag pushes publish; workflow_dispatch runs the FULL rehearsal (builds
    # already ran against the tag's code) and stops before publication - this
    # is the dry-run coverage for installer/SHA256SUMS/Ed25519 the owner asked
    # for, and it can only exist because dispatch sits BESIDE on: push: tags.
    permissions:
      contents: write   # THE ONLY job with write scope (release creation)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    env:
      # Owner p5-1: dry-run must exercise signature/checksums, so the version
      # gates need a valid version on dispatch too: tag pushes use the real
      # tag, dispatch uses v$(cat VERSION) of the checked-out commit.
      RELEASE_TAG: ${{ github.event.inputs.tag || needs.build-linux.outputs.release_tag }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned (mutable tags are the workflow-injection vector)
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
          # merge-base --is-ancestor in the placement gate needs real history;
          # shallow default (depth 1) makes it "Not a git repository"-grade fail.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && 0 || 50 }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 pinned (mutable tags are the workflow-injection vector)
        with:
          go-version: "1.26"
          cache: true

      - name: Download Windows Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 pinned (mutable tags are the workflow-injection vector)
        with:
          name: nord-launcher-windows
          path: release-assets/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 pinned (mutable tags are the workflow-injection vector)
        with:
          name: nord-launcher-linux
          path: release-assets/

      - name: Verify No Secret Files In Release Assets (N2 Blocker Guard)
        run: |
          if [ -f "release-assets/cf.key" ]; then
            echo "CRITICAL SECURITY ERROR: cf.key was accidentally included in release-assets!"
            exit 1
          fi
          if ls release-assets/ | grep -qi "^cf\.key$"; then
            echo "CRITICAL SECURITY ERROR: cf.key matching file found in release-assets!"
            exit 1
          fi
          echo "PASS: release-assets/ verified free of secret key files."
        shell: bash

      - name: Determine Channel & Prerelease Status
        id: meta
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          if [[ "$TAG" =~ -(beta|alpha|rc) ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify CI Quality Gate Success on Release Commit (T0.4 Process Rule)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          echo "Verifying CI check runs for commit $COMMIT_SHA..."
          STATUS=$(gh api "repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs" --jq '.check_runs[] | select(.name != "Publish GitHub Release") | .conclusion' || true)
          echo "Check run conclusions: $STATUS"
          if echo "$STATUS" | grep -qi "failure"; then
            echo "CRITICAL ERROR: CI quality gate check run failed on commit $COMMIT_SHA!"
            exit 1
          fi
          echo "PASS: CI status verified on release commit."
        shell: bash

      - name: Resolve Release Tag (audit echo only; env.RELEASE_TAG above is authoritative)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release tag: ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "dispatch rehearsal of v$(cat VERSION) (no publication: version/changelog gates are tag-push-only)" >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Release Placement Gate (release commit must be reachable from master)
        # Mechanically enforces docs/RELEASE.md: tags belong on the merged
        # default-branch commit (a tag on a branch head differs from the
        # squash-merge result and silently escapes master).
        run: |
          git fetch -q --no-tags origin master
          if git fetch -q origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" 2>/dev/null; then
            TAG_SHA=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          else
            echo "DRY-NOTE: tag ${RELEASE_TAG} not fetchable; using HEAD sha for the ancestor check."
            TAG_SHA="${GITHUB_SHA}"
          fi
          if ! git merge-base --is-ancestor "${TAG_SHA}" origin/master; then
            echo "CRITICAL ERROR: ${RELEASE_TAG} (${TAG_SHA}) is NOT an ancestor of origin/master (see docs/RELEASE.md)."
            exit 1
          fi
          echo "PASS: ${TAG_SHA} is reachable from master."
        shell: bash

      - name: Verify Changelog Entry Exists for Version (DEFECT-3 Gate)
        # Runs on rehearsals too (owner p1) - a missing release-notes section is
        # exactly the kind of thing that must not first surface on the tag.
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          CLEAN_VER="${TAG#v}"
          echo "Checking CHANGELOG.md for version $CLEAN_VER..."
          if ! grep -q "^## \[$CLEAN_VER\]" CHANGELOG.md; then
            echo "CRITICAL ERROR: Missing '## [$CLEAN_VER]' section in CHANGELOG.md!"
            echo "Silent generic fallback is permanently banned. Every release must have complete release notes."
            exit 1
          fi
          echo "PASS: CHANGELOG.md contains entry for $CLEAN_VER."
        shell: bash

      - name: Version Single-Source Gate (tag == VERSION == package.json == wails.json)
        # On dispatch RELEASE_TAG is v$(cat VERSION), i.e. the same shape a tag run
        # gets, so the gate is exercised rather than skipped.
        run: node scripts/check_version_consistency.js "${{ env.RELEASE_TAG }}"
        shell: bash

      - name: Preflight Production Signing Key (format + trust-root match)
        # v0.7.2 round-6 (owner p2): a dispatch rehearsal signs with the staging
        # key, so nothing else in CI ever proves that ED25519_PRIVATE_KEY parses
        # under the SAME parser the generator uses and derives to the public key
        # pinned in internal/core/updater. A mismatch is unfixable once the tag is
        # out (every installed client would reject the update), so it is checked
        # here, before signing, and never after publishing. Only public halves are
        # printed; the secret itself is never read into a log or a file.
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          go run ./scripts/check_signing_key.go -selftest
          # Build then exec: `go run` collapses any non-zero program exit to 1,
          # which would erase the difference between "secret missing" (rc 3, a
          # warning on rehearsals) and "secret wrong" (rc 1, always fatal).
          go build -o /tmp/check_signing_key ./scripts/check_signing_key.go
          rc=0
          /tmp/check_signing_key -env ED25519_PRIVATE_KEY || rc=$?
          if [ "$rc" -eq 3 ]; then
            if [ "$IS_TAG" = "true" ]; then
              echo "CRITICAL ERROR: tag release without ED25519_PRIVATE_KEY - refusing to fall back to the staging key."
              exit 1
            fi
            echo "::warning::ED25519_PRIVATE_KEY is not configured in this repository: the rehearsal proceeds with the staging key, but 'gh workflow run' cannot prove the production key. Set it before cutting v0.7.2."
            exit 0
          fi
          exit "$rc"
        shell: bash

      - name: Ed25519 Key Selection (tag runs MUST use the prod secret; dispatch is always staging)
        id: key
        env:
          SECRET: ${{ secrets.ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # IS_TAG comes from github.ref (job env: IS_TAG = startsWith(github.ref,
          # 'refs/tags/')), NOT from inputs.tag: a dispatch pointed at an existing tag
          # still runs as a rehearsal, so it can never acquire production authority.
          # (An actionlint lesson: never write an unclosed expression inside a run block.)
          if [ "$IS_TAG" != "true" ]; then
            echo "REHEARSAL: signing with the repo staging key so the signature path is exercised."
            echo "The rehearsal manifest is deliberately NOT production-valid: its asset signatures"
            echo "must be rejected by the shipped client (cmd/e2e stage 16 asserts exactly that)."
            echo "staging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SECRET" ]; then
            echo "CRITICAL ERROR: ED25519_PRIVATE_KEY repository secret is not configured!"
            echo "Official releases cannot be signed without it - and no staging fallback exists here."
            exit 1
          fi
          echo "staging=false" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Generate Signed Ed25519 Update Manifest
        # Ungated on purpose (owner p1): the signature path is the thing that first
        # runs on a tag otherwise. Publication below stays tag-only, so a rehearsal
        # only ever writes files inside this job.
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          STAGING="${{ steps.key.outputs.staging }}"
          if [ "$STAGING" = "true" ] && [ "$IS_TAG" = "true" ]; then
            echo "CRITICAL ERROR: a tag release resolved to the staging key. Refusing to publish a manifest no client will trust."
            exit 1
          fi
          if [ "$STAGING" != "true" ] && [ -z "${ED25519_PRIVATE_KEY:-}" ]; then
            echo "CRITICAL ERROR: prod signing requested but ED25519_PRIVATE_KEY is empty at this step."
            exit 1
          fi
          EXTRA=""
          if [ "$STAGING" = "true" ]; then EXTRA="--allow-insecure-dev-key"; fi
          go run scripts/generate_manifest.go \
            -version "${{ env.RELEASE_TAG }}" \
            -channel "${{ steps.meta.outputs.channel }}" \
            -dist release-assets \
            -strict-changelog \
            $EXTRA \
            -out "release-assets/manifest-${{ steps.meta.outputs.channel }}.json"

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt

      - name: Verify Manifest With the Updater's Own Code (sign + verify in one circle)
        # Owner p5-1: the same ed25519 code path the shipped client uses
        # (internal/core/updater.VerifyPayload) validates the freshly signed
        # manifest and every listed artifact - so a bad key/format fails the
        # rehearsal, not the release.
        run: |
          FLAG=""
          if [ "${{ steps.key.outputs.staging }}" = "true" ]; then FLAG="--staging-pubkey"; fi
          # No flag on a tag run => verification uses updater.GetDefaultPublicKey(),
          # i.e. exactly the trust root the shipped client has, after signing and
          # before publication (owner p2).
          go run ./scripts/verify_manifest_sig.go --dist release-assets --channel "${{ steps.meta.outputs.channel }}" $FLAG
          if [ "${{ steps.key.outputs.staging }}" = "true" ]; then
            # Prove the rehearsal artifact really is rehearsal-only: the production
            # client's key must reject what the staging key signed.
            if go run ./scripts/verify_manifest_sig.go --dist release-assets --channel "${{ steps.meta.outputs.channel }}" >/dev/null 2>&1; then
              echo "CRITICAL ERROR: a staging-signed manifest verified against the PRODUCTION client key - the two keys are not isolated."
              exit 1
            fi
            echo "PASS: the production client key rejects the rehearsal signature (staging isolation holds in CI, not only in tests)."
          fi
        shell: bash

      - name: Generate Release Body with Complete 6-Row Artifact Table (DEFECT-2 Fix)
        run: |
          go run scripts/generate_manifest.go \
            -version "${{ env.RELEASE_TAG }}" \
            -channel "${{ steps.meta.outputs.channel }}" \
            -dist release-assets \
            -strict-changelog \
            -out-body "release-body.md" \
            -body-only

      - name: Verify Release Body Length & Content
        run: |
          if [ ! -f "release-body.md" ]; then
            echo "ERROR: release-body.md was not generated!"
            exit 1
          fi
          BODY_LEN=$(wc -c < release-body.md)
          echo "Release body length: $BODY_LEN bytes"
          if [ "$BODY_LEN" -lt 300 ]; then
            echo "ERROR: Release body too short ($BODY_LEN bytes < 300 bytes threshold). Check CHANGELOG.md extraction!"
            exit 1
          fi
          if ! grep -q "### Overview" release-body.md; then
            echo "ERROR: Release body missing '### Overview' section!"
            exit 1
          fi
          if ! grep -q "### Verification & Forensic Integrity" release-body.md; then
            echo "ERROR: Release body missing '### Verification & Forensic Integrity' section!"
            exit 1
          fi
          if grep -qi "channel) release\." release-body.md; then
            echo "CRITICAL ERROR: Release body contains generic fallback changelog! Extraction failed."
            exit 1
          fi
          TABLE_DATA_ROWS=$(grep -Ec '\| `?[A-Za-z0-9._-]+\.(exe|tar\.gz|json|txt|zip)`? .*[0-9a-f]{64}' release-body.md || true)
          echo "Release body table data rows: $TABLE_DATA_ROWS"
          if [ "$TABLE_DATA_ROWS" -lt 5 ]; then
            echo "ERROR: Release body table too short ($TABLE_DATA_ROWS data rows < 5 rows threshold)!"
            exit 1
          fi
          echo "PASS: Release body verified ($BODY_LEN bytes, $TABLE_DATA_ROWS data rows)."
        shell: bash

      - name: Compile metrics.json (single source for the README perf story)
        run: |
          TAR=$(ls release-assets/*.tar.gz | head -1)
          WIN=$(ls release-assets/*.exe | head -1)
          BUNDLE_KB="${{ needs.build-linux.outputs.bundle_gzip_kb }}"
          [ -n "$BUNDLE_KB" ] || BUNDLE_KB=null
          COV="${{ needs.build-linux.outputs.core_coverage }}"
          [ -n "$COV" ] || COV=null
          mkdir -p /tmp/metrics-extract
          tar -xzf "$TAR" -C /tmp/metrics-extract
          BIN=$(find /tmp/metrics-extract -type f -name "nord-launcher*" ! -name "*.sh" ! -name "*.desktop" ! -name "*.png" | head -1)
          go run ./scripts/release_metrics.go \
            --version "$RELEASE_TAG" \
            --tar-bytes "$(wc -c < "$TAR")" \
            --linux-binary-bytes "$(wc -c < "$BIN")" \
            --windows-installer-bytes "$(wc -c < "$WIN")" \
            --bundle-gzip-kb "$BUNDLE_KB" \
            --core-coverage "$COV" \
            --out release-assets/metrics.json
          cat release-assets/metrics.json
        shell: bash

      - name: Upload Rehearsal Assets (manifest, sums, metrics - nothing is published)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: rehearsal-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event.inputs.publish != 'false' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 pinned (mutable tags are the workflow-injection vector)
        with:
          files: release-assets/*
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-body.md

      - name: Ensure GitHub Release Body Matches (DEFECT-2 Sync)
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event.inputs.publish != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ env.RELEASE_TAG }}" --notes-file release-body.md
          echo "PASS: GitHub release notes synced from release-body.md."
        shell: bash

      - name: Verify Published Release Assets (N2 Assert 4)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "${{ env.RELEASE_TAG }}" --json assets --jq '.assets.[].name')
          echo "Published assets: $ASSETS"
          if echo "$ASSETS" | grep -qi "^cf\.key$"; then
            echo "CRITICAL SECURITY ERROR: cf.key published as public release asset!"
            exit 1
          fi
          echo "PASS: Public release assets verified clean of sidecar key."
        shell: bash
