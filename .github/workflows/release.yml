name: Production Release & Cross-Platform Packaging

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12"

      - name: Build Frontend
        working-directory: frontend
        run: |
          pnpm install
          pnpm build

      - name: Write CurseForge Sidecar Key
        env:
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows
          if ($env:CURSEFORGE_KEY) {
            Set-Content -Path "dist/windows/cf.key" -Value $env:CURSEFORGE_KEY -NoNewline
            Write-Host "Created dist/windows/cf.key ($($env:CURSEFORGE_KEY.Length) chars)"
          }

      - name: Compile Windows Executable
        shell: pwsh
        run: |
          go build "-ldflags=-s -w -H=windowsgui -X main.version=$($env:GITHUB_REF_NAME)" -o dist/windows/NordLauncher.exe cmd/launcher/main.go

      - name: Verify Secret Not In Shipped Binary (S2 Asserts 1 & 2)
        env:
          CF_SECRET: ${{ secrets.CURSEFORGE_API_KEY }}
        shell: pwsh
        run: |
          $buildInfo = go version -m dist/windows/NordLauncher.exe | Out-String
          if ($buildInfo -match "CurseForgeKey" -or ($env:CF_SECRET -and $buildInfo.Contains($env:CF_SECRET))) {
            Write-Error "CRITICAL SECURITY ERROR: Secret leaked in go version -m buildinfo!"
            exit 1
          }
          Write-Host "PASS: go version -m is clean of secrets."

          if ($env:CF_SECRET) {
            $hasSecret = Select-String -Path "dist/windows/NordLauncher.exe" -Pattern $env:CF_SECRET -SimpleMatch -Quiet
            if ($hasSecret) {
              Write-Error "CRITICAL SECURITY ERROR: Secret found in executable strings table!"
              exit 1
            }
            Write-Host "PASS: Executable binary is clean of secret."
          }

      - name: Verify Sidecar Key Present for Installer (S2 Assert 3)
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/windows/cf.key")) {
            Write-Error "ERROR: dist/windows/cf.key was not created!"
            exit 1
          }
          $keyLen = (Get-Item "dist/windows/cf.key").Length
          if ($keyLen -lt 16) {
            Write-Error "ERROR: dist/windows/cf.key length ($keyLen bytes) is below minimum (16)!"
            exit 1
          }
          Write-Host "PASS: dist/windows/cf.key verified ($keyLen bytes)."

      - name: Check Binary Size Budget (<= 40 MB)
        run: |
          node -e '
            const fs = require("fs");
            const bin = "dist/windows/NordLauncher.exe";
            const size = fs.statSync(bin).size;
            console.log("Binary size: " + (size / 1048576).toFixed(2) + " MB");
            if (size > 40 * 1024 * 1024) {
              console.error("Binary exceeded 40 MB budget!");
              process.exit(1);
            }
          '

      - name: Sign Windows Executable (Authenticode)
        shell: pwsh
        run: |
          ./scripts/sign_windows.ps1 -TargetFile "dist/windows/NordLauncher.exe"

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) {
              $makensis = $cmd.Source
            } else {
              choco install nsis -y --no-progress
              $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
            }
          }
          & $makensis "/DVERSION=${{ github.ref_name }}" build/windows/installer.nsi
          if (Test-Path "build/windows/NordLauncher-Setup.exe") {
            Move-Item -Force build/windows/NordLauncher-Setup.exe dist/windows/NordLauncher-Setup.exe
          } elseif (Test-Path "NordLauncher-Setup.exe") {
            Move-Item -Force NordLauncher-Setup.exe dist/windows/NordLauncher-Setup.exe
          }

      - name: Sign NSIS Installer (Authenticode)
        shell: pwsh
        run: |
          ./scripts/sign_windows.ps1 -TargetFile "dist/windows/NordLauncher-Setup.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nord-launcher-windows
          path: |
            dist/windows/NordLauncher.exe
            dist/windows/NordLauncher-Setup.exe

  build-linux:
    name: Build & Package Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12"

      - name: Install Linux GUI Dependencies (GTK4 & WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev pkg-config

      - name: Build Release Tarball
        env:
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -n "$CURSEFORGE_KEY" ]; then
            if [ ${#CURSEFORGE_KEY} -lt 16 ]; then
              echo "ERROR: Invalid CURSEFORGE_API_KEY secret length (expected at least 16 chars)"
              exit 1
            fi
          fi
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh "${{ github.ref_name }}" "$CURSEFORGE_KEY"
        shell: bash

      - name: Verify Secret Not In Shipped Linux Binary & Tarball (S2 Linux Asserts 1, 2, 3)
        env:
          CF_SECRET: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          BUILD_INFO=$(go version -m dist/linux/nord-launcher)
          if echo "$BUILD_INFO" | grep -Eq "CurseForgeKey"; then
            echo "CRITICAL SECURITY ERROR: Secret leaked in Linux buildinfo!"
            exit 1
          fi
          if [ -n "$CF_SECRET" ]; then
            if echo "$BUILD_INFO" | grep -Fq "$CF_SECRET"; then
              echo "CRITICAL SECURITY ERROR: Secret string found in Linux buildinfo!"
              exit 1
            fi
            if grep -Fq "$CF_SECRET" dist/linux/nord-launcher; then
              echo "CRITICAL SECURITY ERROR: Secret string found in Linux binary!"
              exit 1
            fi
          fi
          TARBALL=$(ls dist/linux/nord-launcher-v*-linux-amd64.tar.gz)
          if ! tar -ztvf "$TARBALL" | grep -q "cf.key"; then
            echo "ERROR: cf.key not packaged into release tarball!"
            exit 1
          fi
          echo "PASS: Linux binary and tarball verified (clean binary + sidecar present in tarball)."
        shell: bash

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nord-launcher-linux
          path: dist/linux/nord-launcher-v*.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nord-launcher-windows
          path: release-assets/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nord-launcher-linux
          path: release-assets/

      - name: Verify No Secret Files In Release Assets (N2 Blocker Guard)
        run: |
          if [ -f "release-assets/cf.key" ]; then
            echo "CRITICAL SECURITY ERROR: cf.key was accidentally included in release-assets!"
            exit 1
          fi
          if ls release-assets/ | grep -qi "^cf\.key$"; then
            echo "CRITICAL SECURITY ERROR: cf.key matching file found in release-assets!"
            exit 1
          fi
          echo "PASS: release-assets/ verified free of secret key files."
        shell: bash

      - name: Determine Channel & Prerelease Status
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ -(beta|alpha|rc) ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate Ed25519 Secret Guard
        run: |
          if [ -z "${{ secrets.ED25519_PRIVATE_KEY }}" ]; then
            echo "CRITICAL ERROR: ED25519_PRIVATE_KEY repository secret is not configured!"
            echo "Official releases cannot be signed without a secure cryptographic key."
            exit 1
          fi
        shell: bash

      - name: Generate Signed Ed25519 Update Manifest
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
        run: |
          go run scripts/generate_manifest.go \
            -version "${{ github.ref_name }}" \
            -channel "${{ steps.meta.outputs.channel }}" \
            -dist release-assets \
            -out "release-assets/manifest-${{ steps.meta.outputs.channel }}.json"

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          name: ${{ github.ref_name }}
          body: |
            Nord Launcher ${{ github.ref_name }} (${{ steps.meta.outputs.channel }} channel release).

            **Full Changelog**: https://github.com/Aethelis-Projects/Aethelis-Launcher/compare/v0.1.0...${{ github.ref_name }}

      - name: Verify Published Release Assets (N2 Assert 4)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets.[].name')
          echo "Published assets: $ASSETS"
          if echo "$ASSETS" | grep -qi "^cf\.key$"; then
            echo "CRITICAL SECURITY ERROR: cf.key published as public release asset!"
            exit 1
          fi
          echo "PASS: Public release assets verified clean of sidecar key."
        shell: bash
