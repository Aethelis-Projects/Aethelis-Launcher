name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      placeholder: e.g. 0.1.2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (if any)
      description: Paste relevant log excerpts. Do not include tokens or personal data.