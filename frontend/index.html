    <!-- Fallback twin of wails.CSPPolicy() (internal/adapters/wails/csp.go).
         Header wins where the backend propagates it; this <meta> guarantees
         the policy on webview backends that do not (kept byte-equivalent). -->
    <!-- Fallback twin of wails.CSPPolicy() (internal/adapters/wails/csp.go).
         Header wins where the backend propagates it; this <meta> guarantees
         the policy on webview backends that do not (kept byte-equivalent). -->
    <title>Nord Launcher</title>

        const dynamicImport = new Function("u", "return import(u)");

        window.wails = wails;
      } catch (_) {}
    </script>
    <script type="module" src="/src/index.tsx"></script>
